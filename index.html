<!doctype html>
<html lang="en">
<head>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0c0d16; }
  body { font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f6f1e4; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; }
  #top { top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 8px; }
  #info { font-size: 13px; font-weight: 650; opacity: .8; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb { pointer-events: auto; min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid #ffffff26; background: #ffffff12; color: #f6f1e4; font: 700 13px system-ui, sans-serif; cursor: pointer; padding: 0 10px; }
  #status { left: 0; right: 0; text-align: center; font-weight: 800; font-size: 16px; text-shadow: 0 2px 6px #000; padding: 0 12px; }
  #net { bottom: max(4px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .6; }
  #bar { position: fixed; left: 0; right: 0; bottom: calc(max(6px, env(safe-area-inset-bottom)) + 18px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 10px; }

  #raise .q { min-width: 44px; min-height: 40px; border-radius: 10px; border: 1px solid #ffffff2a; background: #1b2033; color: #f6f1e4; font: 700 12px system-ui, sans-serif; cursor: pointer; padding: 0 6px; }
  #track { flex: 1; height: 40px; position: relative; touch-action: none; cursor: pointer; }
  #track::before { content: ""; position: absolute; left: 0; right: 0; top: 17px; height: 6px; border-radius: 3px; background: #ffffff24; }
  #fill { position: absolute; left: 0; top: 17px; height: 6px; border-radius: 3px; background: #e9b949; }
  #thumb { position: absolute; top: 6px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3c8, #e9b949 60%, #a87918); box-shadow: 0 2px 6px #000a; }
  #btns { display: flex; gap: 8px; width: min(520px, 100%); }
  #btns button { flex: 1; min-height: 50px; border-radius: 14px; border: 0; font: 800 15px system-ui, sans-serif; cursor: pointer; color: #fff; box-shadow: 0 3px 0 #0006; }

  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: #161a2b; border: 1px solid #e9b94944; text-align: center; }
  .card h2 { margin: 0; font-size: 26px; } .card p { margin: 6px 0 10px; opacity: .85; }

  .card ol { text-align: left; margin: 0 0 12px; padding-left: 24px; font-size: 14px; min-height: 30px; }
  .card li span { float: right; }
  .card button { width: 100%; min-height: 48px; border-radius: 12px; border: 0; font: 800 16px system-ui, sans-serif; cursor: pointer; margin-top: 8px; }
  #again { background: #e9b949; color: #231400; } #close { background: #ffffff1a; color: #fff; }
  .small { font-size: 12px; opacity: .6; margin-top: 10px; }
  .ranks { text-align: left; font-size: 14px; margin: 0 0 8px; padding-left: 22px; }
  .ranks li { margin: 2px 0; } .ranks li i { opacity: .6; font-style: normal; font-size: 12px; }
  .hide { display: none !important; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="top"><span id="info"></span><button class="tb hide" id="buyBtn">Buy back in</button><button class="tb" id="rankBtn">Hands</button><button class="tb" id="lbBtn">🏆</button></div>
<div class="hud" id="status"></div>
<div id="bar" hidden>
  <div id="raise"><button class="q" data-q="min">Min</button><button class="q" data-q="half">½ pot</button><button class="q" data-q="pot">Pot</button><div id="track"><div id="fill"></div><div id="thumb"></div></div><button class="q" data-q="all">All-in</button></div>
  <div id="btns"><button id="fold">Fold</button><button id="call">Check</button><button id="raiseBtn">Raise</button></div>
</div>
<div class="hud" id="net">Connecting…</div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <div id="overBody"></div>
  <h3 id="boardTitle">Biggest pots won</h3><ol id="board"><li>Loading…</li></ol>
  <button id="again">Buy back in</button><button id="close">Back to the table</button>
  <p class="small">Play chips only. No real money, nothing to buy.</p>
</div></div>
<script>
/* ═══ HOLD'EM NIGHT · a Multiplayer Agent starter ═════════════════════════════════════════
 * Texas hold'em for play chips: two cards each, five on the board, best five-card hand wins.
 * Turn-based, 2–8 seats; bots fill the empty ones. Play chips only: no real money, no purchases.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ seats, blinds, buy-in, timers, the bots, the leaderboard
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED HOLES .. the Seal helper: hole cards are encrypted so only their owner can read them
 *   CARDS ......... the deck, the seeded shuffle, ranking a hand (best 5 of 7)
 *   BETTING ....... blinds, fold/check/call/raise, ending a street, side pots, the showdown
 *   BOTS .......... hand strength by quick simulation, plus some bluffing
 *   TABLE (HOST) .. seats, dealing a hand, bot turns, the turn timer, taking over as a new host.
 *                   Only the host writes the shared fields.
 *   MY CARDS ...... reading my sealed hole cards, acting, re-sending them to a new host
 *   DRAW .......... the felt, seats, cards, chips, flying chips and cards, confetti
 *   HUD & RESULTS . the action bar and raise slider, status, the bust card, the leaderboard
 *   MAIN LOOP ..... heartbeat, host tick, drawing
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the rules):
 *   - The table lives in shared fields only the HOST writes: `game` (one JSON field: id = hand
 *     number, v, phase "bet"|"run"|"show", seats [{i id, n name, c color, b bot, st stack,
 *     bt bet this street, tt put in this hand, h dealt in, f folded, al all-in, ok acted,
 *     la last action}], btn, street, board, hi, minR, turn, t, turnAt, turnEnds, last,
 *     shown, res, endsAt) and `hole0`…`hole7` (each human's two cards, SEALED to that
 *     player's public key, so only they can read them; the host deals, so it can too).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s).
 *     It holds the shuffled deck and the bots' cards in its own memory.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `pk` (public key), `hb`.
 *   - Players send intents to the host: "act" {g, t, a: fold|check|call|raise, to} and
 *     "rebuy" {g}. `t` counts every action, so an old or double intent is ignored.
 *   - When the host changes mid-hand, every player re-sends its own cards sealed to the new
 *     host ("myhole" {to, r, box}). The new host rebuilds the deck from the cards nobody
 *     holds and deals the bots fresh cards (nobody saw theirs anyway).
 *   - Timers are timestamps: turnEnds (then the host checks or folds for you), endsAt (next hand).
 *   - ?attract plays offline with bots (your seat on autopilot) for the preview video.
 *   - Leaderboard "biggest-pot": the biggest pot each player has won.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 6,             // seats at the table, bots fill the empty ones (2 to 8)
  buyIn: 1000,          // play chips you sit down with (and buy back in with)
  smallBlind: 10,
  bigBlind: 20,
  turnMs: 25000,        // time to act before the host checks (or folds) for you
  botMs: 1100,          // how long a bot thinks
  dealMs: 1200,         // the deal animation before the first turn
  runMs: 1300,          // all-in: pause between each street of the run-out
  showMs: 6000,         // showdown result shows this long, then the next hand
  foldWinMs: 2600,      // everyone folded: the next hand comes sooner
  seatGraceMs: 10000,   // a player silent this long hands its seat to a bot
  rejoinMs: 3000,       // a new host waits this long for everyone to re-send their cards
  botTrials: 260,       // simulated deals a bot runs to judge its hand (more = smarter, slower)
  botBluff: 0.09,       // how often a bot bets or raises with nothing
  hintMs: 14000,        // the how-to-play hint shows this long
  board: "biggest-pot", // leaderboard name
};
const BOT_NAMES = ["Ace", "Queenie", "Lucky", "Rio", "Dusty", "Vegas", "Mo", "Duchess"];
// each bot's style: loose = plays more hands, aggr = bets and raises more
const BOT_STYLE = [{ loose: 0.5, aggr: 0.6 }, { loose: 0.2, aggr: 0.3 }, { loose: 0.8, aggr: 0.4 }, { loose: 0.4, aggr: 0.9 },
  { loose: 0.3, aggr: 0.2 }, { loose: 0.7, aggr: 0.8 }, { loose: 0.5, aggr: 0.5 }, { loose: 0.2, aggr: 0.7 }];
const COLORS = ["#ff8a65", "#4fc3f7", "#ffd54f", "#81c784", "#ba68c8", "#f06292", "#4dd0e1", "#aed581", "#ff5f6d", "#9fa8ff"];
const NAME_A = ["Happy", "Sneaky", "Lucky", "Quick", "Jolly", "Clever", "Cool"], NAME_B = ["Otter", "Panda", "Fox", "Koala", "Badger", "Moose", "Shark"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'holdem-night',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
/** Still in the room and heard from within the seat grace time (a backgrounded phone keeps its seat). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── SEALED HOLES ────────────────────────────────────────────────────────────────────
// Everything in room state reaches every client, so hole cards are written SEALED: encrypted
// so only their one reader can open them. Each player publishes a public key in its own entity
// (`pk`); the host seals each player's two cards to that key and writes the box into shared.
//   - The host deals, so the host can read every hand. Fine for friends, not cheat-proof.
//   - A new host can't open boxes the old host sealed, so every player re-sends its own cards
//     to the new host (sealed, with mp.send), and the new host rebuilds the deck from those.
//   - crypto.subtle needs https or localhost. Offline you are the host and there is nobody to
//     hide from, so seal()/open() pass the value through.
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const Seal = {
  pair: null,
  pub: "",
  keys: new Map(), // other player's public key -> derived AES key
  get on() { return !!(window.crypto && crypto.subtle); },
  /** Make this player's key pair. Returns the public key to publish: me.set("pk", pub). */
  async init() {
    if (!this.on) return "";
    this.pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    this.pub = b64(await crypto.subtle.exportKey("raw", this.pair.publicKey));
    return this.pub;
  },
  async key(otherPub) {
    let k = this.keys.get(otherPub);
    if (!k) {
      const theirs = await crypto.subtle.importKey("raw", unb64(otherPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      k = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, this.pair.privateKey, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
      this.keys.set(otherPub, k);
    }
    return k;
  },
  /** Seal any JSON value so only the holder of `toPub` (and you) can open it. */
  async seal(toPub, value) {
    if (!this.on) return "p:" + JSON.stringify(value);
    if (!toPub || !this.pair) return ""; // never plaintext online: nobody can open an empty box
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(toPub), new TextEncoder().encode(JSON.stringify(value)));
    return b64(iv) + "." + b64(ct);
  },
  /** Open a box sealed by the player whose public key is `fromPub`. Null if it isn't for you. */
  async open(fromPub, box) {
    if (typeof box !== "string") return null;
    if (box.startsWith("p:")) return JSON.parse(box.slice(2));
    if (!this.on || !fromPub || !this.pair) return null;
    try {
      const [iv, ct] = box.split(".").map(unb64);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await this.key(fromPub), ct);
      return JSON.parse(new TextDecoder().decode(pt));
    } catch { return null; }
  },
};

// ── CARDS ───────────────────────────────────────────────────────────────────────────
// A card is two letters: rank (2-9, T, J, Q, K, A) and suit (s ♠, h ♥, d ♦, c ♣). "As", "Td", "7h".
const RANKS = "23456789TJQKA", SUITS = "shdc", SUIT_SYM = { s: "♠", h: "♥", d: "♦", c: "♣" };
const RANK_SHOW = { T: "10" }, RANK_WORD = ["Twos", "Threes", "Fours", "Fives", "Sixes", "Sevens", "Eights", "Nines", "Tens", "Jacks", "Queens", "Kings", "Aces"];
const HAND_NAMES = ["High card", "Pair", "Two pair", "Three of a kind", "Straight", "Flush", "Full house", "Four of a kind", "Straight flush"];
const fullDeck = () => [...RANKS].flatMap((r) => [...SUITS].map((s) => r + s));
const rankOf = (c) => RANKS.indexOf(c[0]) + 2; // 2..14
/** mulberry32: a small seeded random number generator (same seed, same numbers). */
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(a, rnd = Math.random) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/** A fresh deck shuffled from a random seed (the seed and the deck stay in the host's memory). */
function shuffledDeck() { const seed = crypto.getRandomValues ? crypto.getRandomValues(new Uint32Array(1))[0] : Math.floor(Math.random() * 2 ** 32); return shuffle(fullDeck(), mulberry32(seed)); }
/** The highest straight in a set of ranks (5 = the A-2-3-4-5 wheel), or 0. */
function straightHigh(rset) {
  for (let h = 14; h >= 5; h--) {
    let ok = true;
    for (let k = 0; k < 5 && ok; k++) { const r = h - k; ok = rset.has(r === 1 ? 14 : r); }
    if (ok) return h;
  }
  return 0;
}
/** Rank the best five-card hand in 2–7 cards: { s: score (higher wins), cat: 0–8, best: [cards], name }. */
function evalHand(cards) {
  const bySuit = {}, byRank = {};
  for (const c of cards) { (bySuit[c[1]] ||= []).push(c); (byRank[rankOf(c)] ||= []).push(c); }
  const desc = (list) => list.slice().sort((a, b) => rankOf(b) - rankOf(a));
  const take = (ranks, pool) => { const out = [], left = pool.slice(); for (const r of ranks) { const i = left.findIndex((c) => rankOf(c) === (r === 1 ? 14 : r)); if (i >= 0) out.push(left.splice(i, 1)[0]); } return out; };
  const result = (cat, kick, best) => ({ cat, s: kick.reduce((a, k, i) => a + k * 15 ** (4 - i), cat * 15 ** 5), best });
  const flushSuit = Object.keys(bySuit).find((s) => bySuit[s].length >= 5);
  if (flushSuit) {
    const fl = bySuit[flushSuit], h = straightHigh(new Set(fl.map(rankOf)));
    if (h) return named(result(8, [h], take([h, h - 1, h - 2, h - 3, h - 4], fl)));
  }
  const groups = Object.entries(byRank).map(([r, list]) => ({ r: +r, n: list.length })).sort((a, b) => b.n - a.n || b.r - a.r);
  const kickers = (skip, k) => desc(cards).filter((c) => !skip.includes(rankOf(c))).slice(0, k);
  const g0 = groups[0], g1 = groups[1];
  if (g0.n === 4) { const kk = kickers([g0.r], 1); return named(result(7, [g0.r, ...kk.map(rankOf)], [...byRank[g0.r], ...kk])); }
  if (g0.n === 3 && g1 && g1.n >= 2) return named(result(6, [g0.r, g1.r], [...byRank[g0.r], ...byRank[g1.r].slice(0, 2)]));
  if (flushSuit) { const top = desc(bySuit[flushSuit]).slice(0, 5); return named(result(5, top.map(rankOf), top)); }
  const sh = straightHigh(new Set(cards.map(rankOf)));
  if (sh) return named(result(4, [sh], take([sh, sh - 1, sh - 2, sh - 3, sh - 4], cards)));
  if (g0.n === 3) { const kk = kickers([g0.r], 2); return named(result(3, [g0.r, ...kk.map(rankOf)], [...byRank[g0.r], ...kk])); }
  if (g0.n === 2 && g1 && g1.n === 2) { const kk = kickers([g0.r, g1.r], 1); return named(result(2, [g0.r, g1.r, ...kk.map(rankOf)], [...byRank[g0.r], ...byRank[g1.r], ...kk])); }
  if (g0.n === 2) { const kk = kickers([g0.r], 3); return named(result(1, [g0.r, ...kk.map(rankOf)], [...byRank[g0.r], ...kk])); }
  const top = desc(cards).slice(0, 5);
  return named(result(0, top.map(rankOf), top));
}
/** Add a readable name: "Pair of Nines", "Full house", "Ace high". */
function named(h) {
  const r = rankOf(h.best[0]) - 2;
  h.name = h.cat === 8 && rankOf(h.best[0]) === 14 ? "Royal flush" : h.cat === 1 ? "Pair of " + RANK_WORD[r] : h.cat === 3 ? "Three " + RANK_WORD[r]
    : h.cat === 7 ? "Four " + RANK_WORD[r] : h.cat === 0 ? (RANK_SHOW[h.best[0][0]] || h.best[0][0]).replace(/^A$/, "Ace").replace(/^K$/, "King").replace(/^Q$/, "Queen").replace(/^J$/, "Jack") + " high" : HAND_NAMES[h.cat];
  return h;
}

// ── BETTING ─────────────────────────────────────────────────────────────────────────
// Pure rules on a copy of the game. Every function returns the new game for the host to write.
const inHand = (s) => !!s.h && !s.f;      // dealt in and not folded
const canBet = (s) => inHand(s) && !s.al;  // still has chips to bet
const potOf = (g) => g.seats.reduce((a, s) => a + s.tt, 0); // everything put in this hand
const copyGame = (g) => ({ ...g, seats: g.seats.map((s) => ({ ...s })), board: g.board.slice() });
/** The next seat after `from` (clockwise) that passes `test`, or -1. */
function nextSeat(g, from, test) { const n = g.seats.length; for (let k = 1; k <= n; k++) { const i = (from + k) % n; if (test(g.seats[i], i)) return i; } return -1; }
/** Move chips from a stack into its bet (never more than the stack: that's all-in). */
function putIn(s, amt) { amt = Math.max(0, Math.min(amt, s.st)); s.st -= amt; s.bt += amt; s.tt += amt; if (s.st === 0 && s.h) s.al = 1; return amt; }
const timers = (g, i) => { const t = Date.now(); g.turn = i; g.turnAt = t; g.turnEnds = t + CONFIG.turnMs; return g; };

/** Fold / check / call / raise (to = the total bet this street). Null if it isn't allowed. */
function applyAction(g0, i, a, to) {
  const g = copyGame(g0), s = g.seats[i], owe = g.hi - s.bt;
  if (a === "check" && owe > 0) return null;
  if (a === "call" && owe <= 0) a = "check";
  if (a === "fold") { s.f = 1; s.la = "Fold"; }
  else if (a === "check") s.la = "Check";
  else if (a === "call") { putIn(s, owe); s.la = s.al ? "All-in" : "Call"; }

let dropped = false, board = null, best = 0, overMode = "", closedFor = "", submittedFor = -1;
function hud(g, now) {
  const me = mySeat(g), s = g.seats[me], turnSeat = g.seats[g.turn];
  if (ATTRACT) { for (const id of ["top", "status", "net"]) $(id).classList.add("hide"); return; }
  $("info").textContent = `Hand #${g.id} · Blinds ${CONFIG.smallBlind}/${CONFIG.bigBlind}`;
  let text = "";
  if (me < 0) text = "You're watching · you'll be dealt in next hand";
  else if (g.phase === "bet" && now < view.dealAt + 900) text = "Dealing…";
  else if (myTurn(g)) { const h = myHole.cards.length === 2 ? evalHand([...myHole.cards, ...g.board]).name : ""; text = "Your turn" + (h ? " · you have " + h : ""); }
  else if (g.phase === "bet" && turnSeat) text = `${turnSeat.n}${turnSeat.b ? " is thinking…" : "'s turn"}` + (s && s.h && !s.f && myHole.cards.length === 2 ? " · you have " + evalHand([...myHole.cards, ...g.board]).name : "");
  else if (g.phase === "run") text = "All-in · running out the board";
  else if (g.phase === "show") text = "Next hand in " + Math.max(0, Math.ceil((g.endsAt - Date.now()) / 1000)) + "s";
  if (now < hintUntil && me >= 0 && g.phase === "bet") text = "Best 5-card hand wins: your 2 cards + the board.";
  $("status").textContent = text;
  $("status").style.opacity = $("bar").hidden ? 1 : 0.9;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the table" : ""}`;
  // the leaderboard: submit when I win a pot
  if (g.phase === "show" && submittedFor !== g.id && now > view.winAt) {
    submittedFor = g.id;
    const won = (g.res?.p || []).filter((p) => p.w.includes(me)).reduce((a, p) => a + Math.floor(p.a / p.w.length), 0);
    if (won > best) { best = won; if (board) board.submit(won).catch(() => null); if (view.id >= 0 && won > CONFIG.bigBlind * 10) pop("New best pot!", L.cx, L.cy + L.cw * 1.1, "#ffe08a", 1.1); }
  }
  // the bust card: out of chips
  const bust = s && s.st <= 0 && (g.phase === "show" ? now > view.winAt + 600 : !s.h);
  if (!bust) closedFor = "";
  if (bust && !closedFor && overMode !== "bust") openCard("bust");
  else if (overMode === "bust" && !bust) closeCard();
  $("buyBtn").classList.toggle("hide", !bust || overMode === "bust");
}
function openCard(mode) {
  overMode = mode; $("over").hidden = false;
  const bust = mode === "bust", ranks = mode === "ranks";
  $("overTitle").textContent = bust ? "Out of chips" : ranks ? "Winning hands" : "Biggest pots won";
  $("overSub").textContent = bust ? `They're play chips, so buy back in for ${CONFIG.buyIn.toLocaleString()} and keep going.` : ranks ? "Best at the top. Five cards from your two and the board." : best ? `Your best tonight: ${best.toLocaleString()}` : "Win a pot to get on the board.";
  $("overBody").innerHTML = ranks ? "<ol class='ranks'>" + ["Royal flush <i>A K Q J 10, one suit</i>", "Straight flush <i>five in a row, one suit</i>", "Four of a kind", "Full house <i>three + a pair</i>", "Flush <i>five of one suit</i>", "Straight <i>five in a row</i>", "Three of a kind", "Two pair", "Pair", "High card"].map((x) => `<li>${x}</li>`).join("") + "</ol>" : "";
  $("again").classList.toggle("hide", !bust);
  $("board").classList.toggle("hide", ranks); $("boardTitle").classList.toggle("hide", ranks);
  if (ranks) return;
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  board.top(10).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${Number(e.score).toLocaleString()}</span></li>`).join("") : "<li>No pots yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
function closeCard() { if (overMode === "bust") closedFor = "bust"; overMode = ""; $("over").hidden = true; }
$("again").onclick = () => { act("rebuy", {}); closeCard(); };
$("buyBtn").onclick = () => act("rebuy", {});
$("close").onclick = closeCard;
$("lbBtn").onclick = () => openCard("board");
$("rankBtn").onclick = () => openCard("ranks");
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let myName = "", myColor = COLORS[0], lastHb = 0, last = performance.now(), lastHud = 0;
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];
if (!myName) { myName = pickOne(NAME_A) + " " + pickOne(NAME_B); try { localStorage.setItem("mpa-name", myName); } catch {} }
if (ATTRACT) { for (const id of ["top", "status", "net"]) $(id).classList.add("hide"); Object.assign(CONFIG, { seats: 6, botMs: 330, dealMs: 650, runMs: 650, showMs: 2200, foldWinMs: 1200, botBluff: 0.22, botTrials: 120 }); BOT_STYLE.forEach((b) => { b.loose = Math.min(1, b.loose + 0.4); b.aggr = Math.min(1, b.aggr + 0.3); }); $("net").textContent = ""; }

function frame(now) {
  requestAnimationFrame(frame);
  if (performance.now() - lastTick > 1000) { hostHold = performance.now() + 700; stopHosting(); } // the tab was frozen or in the background: someone else may have hosted meanwhile, so let its state arrive, then adopt it
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else stopHosting();
  const g = game();
  if (g) {
    readMyHole(g);
    resendHole(g, now);
    syncView(g, now);
    actionBar(g);
    if (now - lastHud > 120) { lastHud = now; hud(g, now); }
  }
  draw(g, dt, now);
}

/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again.
 *  The bots' colors at the table count as taken too. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), botColors = (game()?.seats || []).filter((s) => s.b).map((s) => s.c);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !botColors.includes(myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botColors]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  for (const type of ["act", "rebuy"]) net.on(type, (data, from) => { if (isHost() && data) host.inbox.push({ type, from, data }); });
  net.on("myhole", (d, from) => { // a player re-sending its cards to me, the new host
    const g = game(), i = g && d ? seatOf(g, from) : -1;
    if (i < 0 || d.to !== net.sessionId || d.r !== g.id || host.ready) return;
    Seal.open(S.entities.players[from]?.pk, d.box).then((cards) => { if (Array.isArray(cards) && cards.length === 2) host.known.set(i, cards); });
  });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(game()?.seats || []).filter((s) => s.b).map((s) => s.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || pickOne(COLORS);
  const pk = await Seal.init().catch(() => "");
  net.me.set({ n: myName, c: myColor, pk, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
